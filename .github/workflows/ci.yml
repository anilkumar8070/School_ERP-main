name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - '*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  backend-ci:
    name: Backend CI (Database, Migration, Tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d school_erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Cache Prisma Engines
        uses: actions/cache@v4
        with:
          path: ~/.cache/prisma
          key: ${{ runner.os }}-prisma-${{ hashFiles('backend/prisma/schema.prisma') }}
          restore-keys: |
            ${{ runner.os }}-prisma-

      - name: Create Temporary Backend Environment File
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            echo "PORT=4000" > .env
            echo "NODE_ENV=test" >> .env
            echo "DATABASE_URL=${{ env.DATABASE_URL }}" >> .env
            echo "JWT_SECRET=${{ env.JWT_SECRET }}" >> .env
            echo "JWT_EXPIRES=24h" >> .env
          fi

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Run Database Migrations (Schema Push)
        run: npx prisma db push --skip-generate
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Seed Database
        run: node prisma/seed.js
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Run Backend Tests
        run: npm test -- --coverage
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          NODE_ENV: test

      - name: Security Vulnerability Scan (High Severity)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      - name: Upload Test & Coverage Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-coverage
          path: |
            backend/coverage/
            backend/junit.xml
          if-no-files-found: ignore
          retention-days: 7

  frontend-ci:
    name: Frontend CI (Lint, Build, Audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Create Temporary Frontend Environment File
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            echo 'VITE_API_BASE=http://localhost:4000' > .env
          fi

      - name: Install Dependencies
        run: npm ci

      - name: Code Quality (ESLint)
        run: npm run lint

      - name: Build Verification (Vite Build)
        run: npm run build

      - name: Security Vulnerability Scan (High Severity)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      - name: Upload Frontend Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-dist
          path: frontend/dist/
          retention-days: 7
